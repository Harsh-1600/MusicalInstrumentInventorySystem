<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="350" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern / Music Staff Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="90" x2="460" y2="90"/>
    <line x1="40" y1="110" x2="460" y2="110"/>
    <line x1="40" y1="130" x2="460" y2="130"/>
    <line x1="40" y1="150" x2="460" y2="150"/>
    <line x1="40" y1="170" x2="460" y2="170"/>
  </g>

  <!-- Ambient Light Orb -->
  <circle cx="250" cy="160" r="110" fill="url(#glowGrad)" filter="url(#shadow)"/>

  <!-- Instrument Badge Frame -->
  <circle cx="250" cy="155" r="75" fill="#fca5a5" opacity="0.15"/>
  <circle cx="250" cy="155" r="65" fill="#ef4444" opacity="0.3"/>
  <circle cx="250" cy="155" r="55" fill="rgba(0,0,0,0.3)"/>

  <!-- Instrument Icon Emoji -->
  <text x="250" y="178" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
    🥁
  </text>

  <!-- Title Pill Banner -->
  <rect x="70" y="260" width="360" height="48" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <text x="250" y="291" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    Acoustic Drum Kit
  </text>

  <!-- SoundCraft Quality Seal -->
  <g transform="translate(420, 30)">
    <circle cx="0" cy="0" r="16" fill="rgba(255,255,255,0.15)"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HQ</text>
  </g>
</svg>