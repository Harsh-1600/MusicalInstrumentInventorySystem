<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_d97706" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#grad_d97706)" />

  <!-- Background decorative rings -->
  <circle cx="200" cy="140" r="110" fill="none" stroke="#d97706" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="200" cy="140" r="85" fill="none" stroke="#d97706" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Instrument Artwork -->
  <g filter="url(#shadow)">
    
          <!-- Acoustic Guitar Body -->
          <ellipse cx="200" cy="180" rx="48" ry="40" fill="#b45309" stroke="#fef3c7" stroke-width="2.5"/>
          <ellipse cx="200" cy="125" rx="38" ry="30" fill="#b45309" stroke="#fef3c7" stroke-width="2.5"/>
          <!-- Sound hole -->
          <circle cx="200" cy="145" r="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3"/>
          <circle cx="200" cy="145" r="18" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="3,2"/>
          <!-- Bridge -->
          <rect x="180" y="195" width="40" height="8" rx="2" fill="#78350f"/>
          <!-- Neck & Fretboard -->
          <rect x="194" y="45" width="12" height="90" fill="#451a03" stroke="#fef3c7" stroke-width="1"/>
          <!-- Frets -->
          <line x1="194" y1="60" x2="206" y2="60" stroke="#fbbf24" stroke-width="1"/>
          <line x1="194" y1="75" x2="206" y2="75" stroke="#fbbf24" stroke-width="1"/>
          <line x1="194" y1="90" x2="206" y2="90" stroke="#fbbf24" stroke-width="1"/>
          <line x1="194" y1="105" x2="206" y2="105" stroke="#fbbf24" stroke-width="1"/>
          <line x1="194" y1="120" x2="206" y2="120" stroke="#fbbf24" stroke-width="1"/>
          <!-- Headstock -->
          <polygon points="190,45 210,45 208,20 192,20" fill="#78350f" stroke="#fef3c7" stroke-width="1.5"/>
          <!-- Strings -->
          <line x1="197" y1="30" x2="197" y2="195" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.9"/>
          <line x1="200" y1="30" x2="200" y2="195" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.9"/>
          <line x1="203" y1="30" x2="203" y2="195" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.9"/>
        
  </g>

  <!-- Title Badge -->
  <rect x="20" y="246" width="360" height="38" rx="8" fill="rgba(15, 23, 42, 0.75)" backdrop-filter="blur(4px)" />
  <text x="200" y="270" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    ACOUSTIC GUITAR
  </text>
</svg>