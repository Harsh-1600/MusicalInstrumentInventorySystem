<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_818cf8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#grad_818cf8)" />

  <!-- Background decorative rings -->
  <circle cx="200" cy="140" r="110" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="200" cy="140" r="85" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Instrument Artwork -->
  <g filter="url(#shadow)">
    
          <!-- Bass Drum -->
          <circle cx="200" cy="165" r="50" fill="#4338ca" stroke="#e0e7ff" stroke-width="3"/>
          <circle cx="200" cy="165" r="42" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
          <circle cx="200" cy="165" r="14" fill="#6366f1"/>
          <!-- Snare & Tom 1 -->
          <ellipse cx="140" cy="135" rx="28" ry="14" fill="#e0e7ff" stroke="#312e81" stroke-width="2"/>
          <ellipse cx="180" cy="95" rx="24" ry="12" fill="#e0e7ff" stroke="#312e81" stroke-width="2"/>
          <ellipse cx="225" cy="95" rx="24" ry="12" fill="#e0e7ff" stroke="#312e81" stroke-width="2"/>
          <!-- Cymbals -->
          <ellipse cx="120" cy="80" rx="32" ry="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <line x1="120" y1="80" x2="120" y2="180" stroke="#cbd5e1" stroke-width="2.5"/>
          <ellipse cx="270" cy="75" rx="34" ry="9" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <line x1="270" y1="75" x2="270" y2="180" stroke="#cbd5e1" stroke-width="2.5"/>
          <!-- Drumsticks crossed -->
          <line x1="165" y1="130" x2="235" y2="155" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="235" y1="130" x2="165" y2="155" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>

  <!-- Title Badge -->
  <rect x="20" y="246" width="360" height="38" rx="8" fill="rgba(15, 23, 42, 0.75)" backdrop-filter="blur(4px)" />
  <text x="200" y="270" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    DRUM KIT & PERCUSSION
  </text>
</svg>