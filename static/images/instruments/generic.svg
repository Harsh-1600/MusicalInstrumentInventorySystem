<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_38bdf8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#grad_38bdf8)" />

  <!-- Background decorative rings -->
  <circle cx="200" cy="140" r="110" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="200" cy="140" r="85" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Instrument Artwork -->
  <g filter="url(#shadow)">
    
          <!-- Musical Note Icon & Wave -->
          <circle cx="200" cy="140" r="50" fill="#0284c7" opacity="0.3"/>
          <!-- Dual Eighth Notes -->
          <ellipse cx="170" cy="165" rx="16" ry="12" fill="#38bdf8" transform="rotate(-20 170 165)"/>
          <ellipse cx="230" cy="150" rx="16" ry="12" fill="#38bdf8" transform="rotate(-20 230 150)"/>
          <rect x="180" y="85" width="6" height="75" fill="#38bdf8"/>
          <rect x="240" y="70" width="6" height="75" fill="#38bdf8"/>
          <polygon points="180,85 246,70 246,84 180,99" fill="#38bdf8"/>
        
  </g>

  <!-- Title Badge -->
  <rect x="20" y="246" width="360" height="38" rx="8" fill="rgba(15, 23, 42, 0.75)" backdrop-filter="blur(4px)" />
  <text x="200" y="270" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    ACOUSTIC INSTRUMENT
  </text>
</svg>