<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_fb923c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#grad_fb923c)" />

  <!-- Background decorative rings -->
  <circle cx="200" cy="140" r="110" fill="none" stroke="#fb923c" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="200" cy="140" r="85" fill="none" stroke="#fb923c" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Instrument Artwork -->
  <g filter="url(#shadow)">
    
          <!-- Violin Hourglass Body -->
          <path d="M 180 80 C 160 100, 160 120, 175 135 C 160 155, 160 185, 185 200 C 215 200, 240 185, 225 135 C 240 120, 240 100, 220 80 Z" fill="#9a3412" stroke="#fed7aa" stroke-width="2.5"/>
          <!-- F-Holes -->
          <path d="M 182 125 Q 178 135, 182 145" stroke="#431407" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M 218 125 Q 222 135, 218 145" stroke="#431407" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Tailpiece & Bridge -->
          <polygon points="196,170 204,170 202,195 198,195" fill="#18181b"/>
          <rect x="195" y="145" width="10" height="4" fill="#fde047"/>
          <!-- Neck & Scroll -->
          <rect x="197" y="30" width="6" height="55" fill="#18181b"/>
          <circle cx="200" cy="22" r="7" fill="#9a3412" stroke="#fed7aa" stroke-width="1.5"/>
          <!-- Bow diagonal across -->
          <line x1="120" y1="190" x2="280" y2="70" stroke="#fef08a" stroke-width="2.5"/>
          <line x1="122" y1="192" x2="278" y2="72" stroke="#78350f" stroke-width="1.5"/>
        
  </g>

  <!-- Title Badge -->
  <rect x="20" y="246" width="360" height="38" rx="8" fill="rgba(15, 23, 42, 0.75)" backdrop-filter="blur(4px)" />
  <text x="200" y="270" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    VIOLIN & CELLO
  </text>
</svg>